name: Deploy Challenges Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'progress/**'
      - 'challenges-dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./challenges-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ./challenges-dashboard
        run: |
          npm ci

      - name: Parse progress data
        working-directory: ./challenges-dashboard
        run: |
          npm run parse-data

      - name: Build with Astro
        working-directory: ./challenges-dashboard
        run: |
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./challenges-dashboard/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact

      - name: Extract and copy to root
        run: |
          cd artifact
          tar -xf artifact.tar
          cd ..
          rm -rf _astro styles public *.html *.js manifest.json _headers sw.js 2>/dev/null || true
          cp -r artifact/* .
          rm -rf artifact

      - name: Deploy to gh-pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: deploy dashboard from $(git rev-parse --short HEAD~1)" --allow-empty
          git push origin gh-pages
