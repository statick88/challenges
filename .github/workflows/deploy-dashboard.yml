name: Deploy Challenges Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'progress/**'
      - 'challenges-dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'challenges-dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./challenges-dashboard
        run: |
          npm ci

      - name: Parse progress data
        working-directory: ./challenges-dashboard
        run: |
          npm run parse-data

      - name: Build with Astro
        working-directory: ./challenges-dashboard
        run: |
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./challenges-dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
