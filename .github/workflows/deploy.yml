name: Deploy Tech Challenges Dashboard

on:
  push:
    branches:
      - main
      - master
    paths:
      - "challenges/**"
      - "landing-page/src/**"
      - "landing-page/scripts/**"
      - "landing-page/package.json"
      - "landing-page/tailwind.config.js"
      - "learning-journey/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        working-directory: ./landing-page
        run: npm ci

      - name: Generate challenges data from markdown files
        working-directory: ./landing-page
        run: node scripts/generate-challenges-data.js
        env:
          TZ: America/Guayaquil

      - name: Build Astro site
        working-directory: ./landing-page
        run: npm run build
        env:
          TZ: America/Guayaquil
          GITHUB_PAGES: "true"

      - name: Build Quarto ebook
        working-directory: ./learning-journey
        run: quarto render

      - name: Merge Quarto output with Astro dist
        run: cp -r learning-journey/_site landing-page/dist/learning-journey

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing-page/dist

  # NOTE: E2E tests disabled - no test files exist in landing-page/tests/
  # To enable in the future:
  # 1. Add test files to landing-page/tests/e2e/
  # 2. Add @playwright/test to landing-page/package.json devDependencies
  # 3. Uncomment the test job below
  # test:
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: "20"
  #
  #     - name: Install dependencies
  #       working-directory: ./landing-page
  #       run: npm ci
  #
  #     - name: Install Playwright browsers
  #       working-directory: ./landing-page
  #       run: npx playwright install --with-deps chromium
  #
  #     - name: Build for testing
  #       working-directory: ./landing-page
  #       run: npm run build
  #       env:
  #         GITHUB_PAGES: "true"
  #
  #     - name: Run E2E tests
  #       working-directory: ./landing-page
  #       run: npx playwright test --reporter=list
  #
  #     - name: Upload test results
  #       if: always()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: playwright-report
  #         path: landing-page/playwright-report/
  #         retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # NOTE: E2E tests disabled - no test files exist in landing-page/tests/
  # To enable: add @playwright/test to dependencies and create test files
  # test:
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps:
  #     ...

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: success()
    steps:
      - name: Get updated stats
        id: stats
        run: |
          echo "## 🚀 Dashboard Actualizado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Fecha: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Archivos modificados:" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ E2E Tests Passed" >> $GITHUB_STEP_SUMMARY
