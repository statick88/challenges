name: Deploy Tech Challenges Dashboard

on:
  push:
    branches:
      - main
      - master
    paths:
      - "challenges/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # Permite ejecutar manualmente

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para obtener historial completo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate challenges data from markdown files
        run: node scripts/generate-challenges-data.js
        env:
          TZ: America/Guayaquil

      - name: Build Astro site
        run: npm run build
        env:
          TZ: America/Guayaquil
          GITHUB_PAGES: "true"

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notificación de cambios (opcional)
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: success()
    steps:
      - name: Get updated stats
        id: stats
        run: |
          echo "## 🚀 Dashboard Actualizado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Fecha: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Archivos modificados:" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
